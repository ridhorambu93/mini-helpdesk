spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db-mini-helpdesk
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:bjb-helpdesk-secret-key-must-be-at-least-256-bits-long}
    access-token-expiration: 900000       # 15 menit
    refresh-token-expiration: 604800000   # 7 hari
